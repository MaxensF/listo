# Builds the Listo WebView APK in CI — no local Android SDK needed.
# Push the repo to GitHub, grab the artifact from the Actions run.
name: Build Listo APK

on:
  push:
    paths:
      - "android/**"
      - "custom_components/listo/www/**"   # the PWA is bundled inside the APK
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    # Pinned image + explicit tool versions: the build stays identical
    # over time instead of silently following "latest" migrations.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"   # installs this exact Gradle (not the image's)

      # Persistent debug key (stored in repo secrets) so every CI build
      # shares one signature and the APK can be installed over itself.
      # Without this, each runner generates a fresh key -> signature
      # mismatch -> Android forces an uninstall before reinstalling.
      - name: Restore persistent debug key
        run: |
          mkdir -p "$HOME/.android"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d | tee "$HOME/.android/debug.keystore" > android/ci-debug.keystore

      # Fail loudly if the restored keystore is broken — otherwise AGP
      # silently generates a fresh key and every build signs differently,
      # breaking install-over-update on devices. The SHA-256 fingerprint
      # printed here must stay identical across runs.
      - name: Verify debug key
        run: keytool -list -v -keystore android/ci-debug.keystore -storepass android | grep -iE "SHA-?256"

      # Optional: the repo owner can keep their HA URL as the APK default
      # without publishing it — set the LISTO_HA_BASE secret and it is
      # patched in here; forks/others simply get the generic default.
      - name: Set default HA base URL (optional)
        env:
          HA_BASE: ${{ secrets.LISTO_HA_BASE }}
        run: |
          if [ -n "$HA_BASE" ]; then
            sed -i "s|http://homeassistant.local:8123|$HA_BASE|" \
              android/app/src/main/res/values/strings.xml
          fi

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: listo-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 365   # artifacts expire after 90 days by default
